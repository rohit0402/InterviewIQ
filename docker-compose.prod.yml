services:

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod

    container_name: interviewiq-backend

    restart: unless-stopped

    env_file:
      - ./backend/.env

    depends_on:
      postgres:
        condition: service_healthy

    expose:
      - "8000"

  postgres:
    image: postgres:17

    container_name: interviewiq-postgres

    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: rohit1234
      POSTGRES_DB: interviewiq

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL","pg_isready -U postgres -d interviewiq"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine

    container_name: interviewiq-redis

    restart: unless-stopped

    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD","redis-cli","ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod

    container_name: interviewiq-celery

    restart: unless-stopped

    env_file:
      - ./backend/.env

    depends_on:
      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy

    command: celery -A app.core.celery_app:celery_app worker -l info -E

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod

    container_name: interviewiq-frontend

    restart: unless-stopped

    depends_on:
      - backend

    ports:
      - "80:80"

volumes:
  postgres_data:
  redis_data: